# 株価・指数・為替・金利・原油の終値を GitHub のサーバーで自動取得し、data-quotes/ にコミットする。
# クラウドの更新ルーティンは通信制限で Yahoo Finance に届かないことがあるため、
# 数値の取得だけをここ（制限なし・PC不要）で先回りして済ませておく。
name: fetch-quotes

on:
  schedule:
    # NY 終値確定（20:00 UTC 夏時間 / 21:00 UTC 冬時間）の後。
    # 21:30 UTC = 6:30 JST（朝7時のルーティンの前）、2:30 UTC = 11:30 JST（12時の前の再試行）
    - cron: "30 21 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-quotes.yml"
      - "scripts/fetch-quotes.mjs"

permissions:
  contents: write

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 直近の確定取引日の終値を取得
        run: node scripts/fetch-quotes.mjs

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-quotes
          if git diff --cached --quiet; then
            echo "data-quotes に変更なし（既に取得済み）"
            exit 0
          fi
          latest=$(ls data-quotes | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1)
          git commit -m "data-quotes: ${latest%.json} の終値を自動取得（GitHub Actions）"
          git pull --rebase origin main
          git push origin main
